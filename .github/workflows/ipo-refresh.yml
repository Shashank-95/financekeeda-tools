# Keeps the IPO tracker's list current with no one touching it.
#
# ---------------------------------------------------------------------------
# SETUP
# ---------------------------------------------------------------------------
#  1. Put this file at .github/workflows/ipo-refresh.yml in the repo that
#     holds your site, alongside build/fetch_ipos.py and build/fetch_sebi.py.
#  2. Make sure ipos.json ends up beside the widget when you deploy. The
#     widget looks for ./ipos.json relative to itself and needs no editing.
#
# That is the whole setup. There is no API key, no account and no secret to
# add: the data comes from SEBI's own public-issue filings, which are
# published for exactly this purpose. An earlier version of this file sat
# dormant until someone supplied a third-party key; nothing is dormant now.
#
# It runs twice a day on GitHub's infrastructure. Nothing to keep alive,
# nothing to pay for on a public repo, and no server of yours involved.
#
# ---------------------------------------------------------------------------
# WHAT IT DOES WHEN THINGS GO WRONG
# ---------------------------------------------------------------------------
#  * SEBI unreachable          -> the existing file is left alone and the run
#                                 fails, so GitHub emails you. Readers keep
#                                 seeing the last good list, still rotating.
#  * A filing will not parse   -> that one issue is skipped, the rest publish.
#                                 Nothing half-read is ever written.
#  * SEBI serves a stale node  -> the listing is read several times and the
#                                 results unioned. Its nodes genuinely
#                                 disagree; see listing() in fetch_sebi.py.
#  * Pool runs out of open issues -> the file is still written, the run fails
#                                 loudly, and the widget tells readers the
#                                 list needs refreshing rather than pretending.
#
# The commit step runs even when the refresh step fails, so a partial success
# still reaches readers. The job is marked failed afterwards, so a real
# problem cannot pass quietly.

name: Refresh IPO tracker

on:
  schedule:
    # 06:47 and 18:47 IST. Deliberately off the hour — GitHub's scheduler
    # queues heavily at :00 and a delayed run is a stale widget.
    - cron: '17 1,13 * * *'
  workflow_dispatch:          # and a button, for when you want it now

permissions:
  contents: write             # the job commits the refreshed JSON back

concurrency:
  group: ipo-refresh
  cancel-in-progress: false   # never let two runs write the file at once

env:
  SOURCE: sebi                # sebi | url | file | ipoguru
  OUT: public/tools/ipo-tracker/ipos.json
  WIDGET: public/tools/ipo-tracker/index.html
  INPUT_FILE: data/feed.json  # only read when SOURCE is 'file'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20       # a cold run reads a few dozen filings
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The offer dates live inside the filed PDF, so the run needs a PDF
      # text extractor. Nothing else is required.
      - name: Install PyMuPDF
        run: pip install --quiet pymupdf

      - name: Refresh the pool
        id: refresh
        continue-on-error: true        # commit what we got, judge it after
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
          IPO_API_KEY: ${{ secrets.IPO_API_KEY }}
        run: |
          mkdir -p "$(dirname "$OUT")"
          python3 build/fetch_ipos.py \
            --out "$OUT" \
            --source "$SOURCE" \
            ${FEED_URL:+--url "$FEED_URL"} \
            --seed "$WIDGET"

      - name: Commit if the list moved
        run: |
          if [ ! -f "$OUT" ]; then
            echo "nothing written — leaving the repo untouched"
            exit 0
          fi
          git config user.name  "ipo-bot"
          git config user.email "ipo-bot@users.noreply.github.com"
          git add "$OUT"
          if git diff --staged --quiet; then
            echo "no change since the last run"
          else
            git commit -m "IPO list refreshed $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - name: Fail loudly if the refresh did not work
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::The IPO refresh failed. Readers are on the last good"
          echo "::error::list, which still rotates but will not gain new issues."
          exit 1
