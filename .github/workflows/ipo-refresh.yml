# Keeps the IPO tracker's list current with no one touching it.
#
# ---------------------------------------------------------------------------
# SETUP
# ---------------------------------------------------------------------------
#  1. Put this file at .github/workflows/ipo-refresh.yml in the repo that
#     holds your site, alongside build/fetch_ipos.py and build/fetch_sebi.py.
#  2. Make sure ipos.json ends up beside the widget when you deploy. The
#     widget looks for ./ipos.json relative to itself and needs no editing.
#
# That is the whole setup. There is no API key, no account and no secret to
# add. The data comes from two published sources:
#
#   * SEBI's public-issue filings — the audit trail, but posted days or
#     weeks late and with no SME issues;
#   * NSE's "Offer Documents" RSS feed — the same documents within hours,
#     SME included. RSS is published to be read by software; NSE's website
#     API, which its terms forbid automated use of, is never called.
#
# It runs every 30 minutes on GitHub's infrastructure, because NSE's feed
# only holds its latest ~17 items. Nothing to keep alive, nothing to pay for
# on a public repo, and a run that finds nothing new commits nothing.
#
# ---------------------------------------------------------------------------
# WHAT IT DOES WHEN THINGS GO WRONG
# ---------------------------------------------------------------------------
#  * One source unreachable    -> the other's records still publish, and the
#                                 run carries a warning naming the source.
#  * Both unreachable          -> the existing file is left alone and the run
#                                 fails, so GitHub emails you. Readers keep
#                                 seeing the last good list, still rotating.
#  * A document will not parse -> that one is skipped and remembered, the
#                                 rest publish. Nothing half-read is written.
#  * Two sources disagree on a price -> the first stays, the run carries a
#                                 warning. A moved date is taken as an
#                                 extension and logged.
#  * SEBI's RHPs not captured  -> two or more missed fails the run: that is
#                                 the parser breaking, not a quiet market.
#
# No issue being open is NOT a failure — it is a quiet week, and the widget
# says so to readers itself.

name: Refresh IPO tracker

on:
  schedule:
    # Every 30 minutes, off the hour — GitHub's scheduler queues heavily at
    # :00. NSE's feed holds ~17 items; this is what keeps any from scrolling
    # past unread.
    - cron: '7,37 * * * *'
  workflow_dispatch:          # and a button, for when you want it now

permissions:
  contents: write             # the job commits the refreshed JSON back

concurrency:
  group: ipo-refresh
  cancel-in-progress: false   # never let two runs write the file at once

env:
  SOURCE: filings             # filings (SEBI + NSE feed) | sebi | url | file | ipoguru
  OUT: public/tools/ipo-tracker/ipos.json
  WIDGET: public/tools/ipo-tracker/index.html
  NSE_STATE: state/nse-feed-state.json   # which feed items have been read
  INPUT_FILE: data/feed.json  # only read when SOURCE is 'file'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25       # a cold run reads a few dozen filings
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The offer dates live inside the filed PDF, so the run needs a PDF
      # text extractor. Nothing else is required.
      - name: Install PyMuPDF
        run: pip install --quiet pymupdf

      - name: Refresh the pool
        id: refresh
        continue-on-error: true        # commit what we got, judge it after
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
          IPO_API_KEY: ${{ secrets.IPO_API_KEY }}
        run: |
          mkdir -p "$(dirname "$OUT")"
          python3 build/fetch_ipos.py \
            --out "$OUT" \
            --source "$SOURCE" \
            --nse-state "$NSE_STATE" \
            ${FEED_URL:+--url "$FEED_URL"} \
            --seed "$WIDGET"

      - name: Commit if the list moved
        run: |
          if [ ! -f "$OUT" ]; then
            echo "nothing written — leaving the repo untouched"
            exit 0
          fi
          git config user.name  "ipo-bot"
          git config user.email "ipo-bot@users.noreply.github.com"
          git add "$OUT"
          [ -f "$NSE_STATE" ] && git add "$NSE_STATE"
          # Only a change to the list itself is worth purging the CDN for;
          # the state file moves whenever the feed shows something new.
          LIST_MOVED=1
          git diff --staged --quiet -- "$OUT" && LIST_MOVED=0
          if git diff --staged --quiet; then
            echo "no change since the last run"
          else
            git commit -m "IPO list refreshed $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
            [ "$LIST_MOVED" = 1 ] || exit 0
            # jsDelivr keeps a branch file for up to 12 hours and ignores the
            # widget's ?d= query when it does, so without this a refresh can
            # take half a day to reach readers. A purge failing is not worth
            # failing the run over: the cache expires on its own regardless.
            curl -fsS --retry 3 --max-time 30 \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$OUT" \
              || echo "::warning::jsDelivr purge failed; readers catch up within 12 hours"
          fi

      - name: Fail loudly if the refresh did not work
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::The IPO refresh failed. Readers are on the last good"
          echo "::error::list, which still rotates but will not gain new issues."
          exit 1
