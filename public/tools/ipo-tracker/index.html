<!--
  ==========================================================================
  FINANCE KEEDA — Indian IPO Tracker
  ==========================================================================
  Generated by build/shell.py from build/tools/ipo-tracker.html. Do not edit by hand.

  --------------------------------------------------------------------------
  IT ROTATES ITSELF
  --------------------------------------------------------------------------
  There is one pool of issues, each carrying its own dates. On every load the
  widget partitions that pool against TODAY:

      close date today or later  -> open & upcoming, soonest to close first
      close date already past    -> recently closed, most recent first

  So an issue crosses from one tab to the other on its own the morning after
  it closes, and the next one in the queue takes its place in the five rows.
  No server, no API call, no cron. Load the page a week later and it is a
  different five rows.

  What that does NOT do is invent issues that were not in the pool. Rotation
  is free; new companies are not — the refresh job adds them twice a day.

  The footer stamp keeps two facts apart: how many issues are open (a fact
  about the market — none is a normal week, shown grey) and how old the list
  is (a fact about the data — amber only when the job has not refreshed it
  for more than three days). See paintStamp() at the bottom.

  --------------------------------------------------------------------------
  WHERE THE NUMBERS COME FROM
  --------------------------------------------------------------------------
  build/fetch_sebi.py reads SEBI's own Public Issues filings and writes the
  JSON this widget fetches. Not an aggregator, not the exchanges — the filing
  itself, which is why the footer names SEBI rather than a data provider.

  Each record still carries the URL of the filing it was read from. The
  widget does not render it — the column was dropped as clutter — but it
  stays in ipos.json as the audit trail behind every date on screen.

  --------------------------------------------------------------------------
  THE COLUMNS ARE WHAT SEBI CAN ACTUALLY SUPPORT
  --------------------------------------------------------------------------
  This tool used to show a price band and an issue size. Both are gone, and
  their absence is deliberate.

  A Red Herring Prospectus is filed BEFORE the price band is fixed. The
  document reads "aggregating up to Rs [<bullet>] million" — an actual
  placeholder, confirmed across Technocraft, SBI Funds and Ardee. There is no
  band in the filing to read, and no issue size either wherever the offer
  includes an offer-for-sale priced off that band. An early draft of the
  scraper read a number from a nearby promoter table and produced Rs 320 Cr
  for Ardee against a true Rs 425.9 Cr, which is exactly the kind of
  confident wrong number this tool exists not to print.

  Listing gain and subscription are exchange data rather than filings, so
  they are not available here at any price. Grey market premium has no
  authoritative source at all and was never included.

  What replaced them is what the filings genuinely carry: the offer dates, a
  plain-language status, and the final issue price once the Prospectus is
  filed.

  --------------------------------------------------------------------------
  NO HEADING INSIDE THE TOOL — the host page supplies it.
  NO CONTAINER SPACING, MAX WIDTH OR CENTRING — it fills the box it is given
  and starts at its top-left corner.
  FIXED HEIGHT — nothing a reader can do changes it. Two values, because the
  two-column layout stacks below 821px and a single height cannot serve both
  without either clipping the phone or leaving a hole on the desktop. Within
  each band the height is constant, whatever the reader types or drags.

      <style>
        .fk-embed-ipo-tracker{width:100%;border:0;display:block;height:306px}
        @media (min-width:821px){ .fk-embed-ipo-tracker{height:299px} }
      </style>
      <iframe class="fk-embed-ipo-tracker" src="/tools/ipo-tracker.html"
              title="Indian IPO Tracker" loading="lazy" scrolling="no"></iframe>
  ==========================================================================
-->

<style>
/* ---------------------------------------------------------------------------
   Shared foundation for every Finance Keeda banking tool.
   Tokens lifted from financekeeda.com/mutual-funds so all the tools across the
   site read as one system.
   --------------------------------------------------------------------------- */
.fk-calc{
  --surface:#fff; --border:#e9e9e9; --border-strong:#dfdfdf; --line:#f0f1f3;
  --ink:#000; --ink-2:#2d2d2d; --ink-3:#474747; --muted:#6b7280; --muted-2:#9aa1ab;
  --field:#f1f2f4;
  --accent:#37c705; --accent-ink:#227a05; --accent-soft:#f0fbeb;
  --neg:#d1242f; --neg-soft:#fdf0f0;
  --warn-bg:#fff8e8; --warn-ink:#7a5a00; --warn-bd:#f3e3ba;
  --f1:#1E4B87; --f2:#C4823C; --f3:#7E4674;
  --f1-soft:#eef3fa;
  --radius:12px; --radius-sm:8px;
  --ui:"Rubik",-apple-system,system-ui,"Segoe UI","Liberation Sans",sans-serif;
  --display:"Source Serif 4",Georgia,serif;
  --focus:0 0 0 3px rgb(55 199 5 / .28);
}

/* Host owns placement: no spacing, no max width, no centring. */
html,body{margin:0;padding:0}
body{background:var(--surface,#fff)}
.fk-calc,.fk-calc *,.fk-calc *::before,.fk-calc *::after{box-sizing:border-box}
.fk-calc{
  font-family:var(--ui);font-size:14px;color:var(--ink);
  -webkit-font-smoothing:antialiased;
  width:100%;margin:0;padding:0;background:transparent;
}

/* ---- segmented control ---- */
.fk-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;margin-bottom:12px}
.fk-seg{display:flex;gap:4px;padding:4px;background:var(--field);border-radius:11px;
  max-width:100%;overflow-x:auto;scrollbar-width:none}
.fk-seg::-webkit-scrollbar{display:none}
.fk-seg-btn{
  appearance:none;border:0;background:none;font-family:var(--ui);
  font-size:13px;font-weight:600;color:var(--muted);
  padding:9px 16px;border-radius:8px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s,box-shadow .15s;
}
.fk-seg-btn:hover{color:var(--ink-2)}
.fk-seg-btn.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.09)}
.fk-seg-btn:focus-visible{outline:none;box-shadow:var(--focus)}

/* ---- layout ---- */
.fk-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:14px;align-items:stretch}
.fk-panel{
  border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 15px;background:var(--surface);min-width:0;
  display:flex;flex-direction:column;
}
.fk-grid>.fk-panel:first-child{justify-content:space-between}

/* ---- inputs ---- */
.fk-field{margin-bottom:12px;min-width:0}
.fk-field:last-child{margin-bottom:0}
.fk-lab{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.fk-lab label{font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted)}
.fk-lab .hint{font-size:10.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.fk-box{
  display:flex;align-items:center;gap:8px;min-width:0;
  background:var(--field);border:1.5px solid transparent;border-radius:var(--radius-sm);
  padding:0 12px;height:46px;
  transition:border-color .14s,background .14s,box-shadow .14s;
}
.fk-box:focus-within{background:var(--surface);border-color:var(--ink);box-shadow:var(--focus)}
.fk-unit{flex:none;font-size:14px;font-weight:600;color:var(--muted)}
/* Stretched to the full box height so the whole field is the tap target —
   a 20px input inside a 46px box means three quarters of what looks tappable
   isn't. */
.fk-box input{
  flex:1;min-width:0;align-self:stretch;background:none;border:0;outline:none;
  font-family:var(--ui);font-size:16.5px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;-moz-appearance:textfield;
}
.fk-box input::-webkit-outer-spin-button,
.fk-box input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* Two short inputs on one row. Separately they cost a whole field of height
   each for very little information, and that height is dead space: the results
   panel opposite is shorter than four stacked fields, so every field removed
   from the left closes a gap on the right as well as shortening the tool.
   min-width:0 because a grid item defaults to min-width:auto, which lets the
   boxes push past the panel on a phone. */
.fk-pair{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:12px}
.fk-pair .fk-field{margin-bottom:0;min-width:0}

/* Black fill on a grey track — matches the site's other controls.
   The input is 20px tall so it is grabbable on a phone, while the visible
   track stays 6px: a 6px-tall input is almost impossible to hit with a thumb,
   and growing the whole control instead would add height to every field. */
.fk-range{
  -webkit-appearance:none;appearance:none;display:block;width:100%;
  height:20px;margin:2px 0 0;padding:0;outline:none;cursor:pointer;background:transparent;
}
.fk-range::-webkit-slider-runnable-track{
  height:6px;border-radius:99px;
  background:linear-gradient(to right,var(--ink) 0 var(--p,0%),#e4e7eb var(--p,0%) 100%);
}
.fk-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;
  border:3px solid var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.22);cursor:grab;margin-top:-6px;
}
.fk-range::-moz-range-track{height:6px;border-radius:99px;background:#e4e7eb}
.fk-range::-moz-range-progress{height:6px;border-radius:99px;background:var(--ink)}
.fk-range::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--ink);
  box-shadow:0 1px 3px rgb(0 0 0/.22);cursor:grab;
}
.fk-range:active::-webkit-slider-thumb{cursor:grabbing}
.fk-range:focus-visible{box-shadow:var(--focus)}

/* ---- results ---- */
.fk-res{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.fk-card{background:var(--field);border-radius:var(--radius-sm);padding:11px 12px;min-width:0}
.fk-card small{display:block;font-size:9.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.fk-amt{font-size:17px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fk-card.total{grid-column:span 2;background:var(--accent-soft);border:1px solid #d8f0cd;padding:14px}
.fk-card.total.warn{background:var(--warn-bg);border-color:var(--warn-bd)}
.fk-card.total.bad{background:var(--neg-soft);border-color:#f3d3d4}
.fk-card.total .fk-amt{font-size:24px;letter-spacing:-.01em}
.fk-sub{margin-top:5px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fk-sub b{font-weight:700;color:var(--accent-ink)}
.fk-sub b.bad{color:var(--neg)}

dl{margin:0}
.fk-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:5px 0;font-size:12.5px}
.fk-line dt{color:var(--ink-3);min-width:0}
.fk-line dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.fk-line.mut dt,.fk-line.mut dd{color:var(--muted)}
.fk-line.pos dd{color:var(--accent-ink)}
.fk-line.neg dd{color:var(--neg)}
.fk-rule{border-top:1px solid var(--line);margin:5px 0}

/* ---- donut, drawn inline: no chart library, so nothing to load or fail ---- */
.fk-viz{display:flex;align-items:center;gap:14px;margin-top:auto;padding-top:10px}
.fk-donut{flex:none;width:104px;height:104px}
.fk-donut circle{fill:none;stroke-width:13;transform:rotate(-90deg);transform-origin:50% 50%}
.fk-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.fk-leg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);min-width:0}
.fk-dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.fk-leg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fk-leg b{font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- notice ---- */
/* ---- closing note ----
   A block of prose whose wording changes with the inputs will wrap to a
   different number of lines and take the tool's height with it. So the slot is
   sized by a hidden copy of the LONGEST text it can ever hold, stacked in the
   same grid cell as the live text: the cell takes the taller of the two and is
   therefore exact at every width, with no magic em value to re-guess whenever
   the copy changes. */
.fk-slot{display:grid;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.fk-slot>*{grid-area:1/1;margin:0;font-size:11px;line-height:1.5;color:var(--muted)}
.fk-slot .ghost{visibility:hidden;pointer-events:none}
.fk-slot b{font-weight:600;color:var(--ink-3)}

@media (max-width:820px){
  .fk-grid{grid-template-columns:1fr}
  .fk-seg{width:100%}
  .fk-seg-btn{flex:1;min-height:40px}
  .fk-box{height:48px}
  .fk-box input{font-size:17px}
}

/* ==========================================================================
   STOCKS ADDITIONS
   ========================================================================== */

/* ---- select, matched to .fk-box ----
   Native <select> because its popup is browser chrome: it renders outside the
   iframe instead of being clipped by it. A CSS dropdown inside a fixed-height
   widget cannot do that. */
.fk-sel{position:relative;display:flex;align-items:center;min-width:0;
  background:var(--field);border:1.5px solid transparent;border-radius:var(--radius-sm);
  height:46px;padding:0 12px;transition:border-color .14s,background .14s,box-shadow .14s}
.fk-sel:focus-within{background:var(--surface);border-color:var(--ink);box-shadow:var(--focus)}
.fk-sel select{appearance:none;-webkit-appearance:none;background:none;border:0;outline:none;
  width:100%;height:100%;font-family:var(--ui);font-size:15px;font-weight:700;color:var(--ink);
  cursor:pointer;padding-right:18px;text-overflow:ellipsis}
.fk-sel::after{content:"";position:absolute;right:14px;width:7px;height:7px;pointer-events:none;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:translateY(-3px) rotate(45deg)}

/* ---- compact repeated rows (lots, cash flows) ----
   A fixed number of rows, always rendered. Blank rows are ignored by the
   maths, so the reader adds what they have and the tool never changes height. */
.fk-rows{display:grid;gap:7px}
.fk-rhead,.fk-row{display:grid;gap:7px;align-items:center}
.fk-rhead span{font-size:9.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted-2);white-space:nowrap;overflow:hidden}
.fk-mini{display:flex;align-items:center;gap:6px;min-width:0;
  background:var(--field);border:1.5px solid transparent;border-radius:var(--radius-sm);
  padding:0 10px;height:42px;transition:border-color .14s,background .14s,box-shadow .14s}
.fk-mini:focus-within{background:var(--surface);border-color:var(--ink);box-shadow:var(--focus)}
.fk-mini .u{flex:none;font-size:12px;font-weight:600;color:var(--muted)}
.fk-mini input{flex:1;min-width:0;align-self:stretch;background:none;border:0;outline:none;
  font-family:var(--ui);font-size:14.5px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.fk-mini input::-webkit-outer-spin-button,
.fk-mini input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fk-mini input[type=date]{font-size:13px;font-weight:600;min-width:0}
.fk-mini input[type=date]::-webkit-calendar-picker-indicator{padding:0;margin:0;opacity:.45;cursor:pointer}

/* ---- data table ----
   Scrolls sideways rather than wrapping: a wrapped cell changes the row
   height, and the row height is what holds the widget steady. */
.fk-tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fk-tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:600px}
.fk-tbl th{text-align:left;font-size:9.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted-2);padding:0 12px 8px 0;white-space:nowrap}
.fk-tbl td{padding:0 12px 0 0;height:38px;border-top:1px solid var(--line);
  white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.fk-tbl th:last-child,.fk-tbl td:last-child{padding-right:0;text-align:right}
.fk-tbl .co{color:var(--ink);font-weight:600}
.fk-tbl .up{color:var(--accent-ink);font-weight:600}
.fk-tbl .dn{color:var(--neg);font-weight:600}
.fk-tbl .empty td{color:var(--muted-2)}
.fk-tag2{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.04em;
  padding:2px 5px;border-radius:3px;background:var(--field);color:var(--muted);vertical-align:1px}

@media (max-width:820px){
  .fk-mini{height:44px}
  .fk-sel{height:48px}
}

/* ---- dropdown that cannot outgrow the widget ----
   A native <select> popup is drawn by the operating system, so its height
   cannot be constrained by CSS: eighteen currencies render a list several
   times taller than the tool it belongs to. This replaces the popup with a
   listbox drawn inside the widget and capped, at open time, to the space
   actually available above or below the field — so it can never exceed the
   widget's own height, whatever the option count.

   The real <select> stays in the DOM, transparent and on top, so it remains
   focusable and reachable by a screen reader and every tool still reads
   $('id').value and listens for 'change'. Nothing else had to change. */
.fk-sel select{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;z-index:2}
.fk-selval{flex:1;min-width:0;font-family:var(--ui);font-size:15px;font-weight:700;
  color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding-right:18px}
.fk-opts{position:absolute;z-index:40;left:0;right:0;display:none;padding:4px;
  background:var(--surface);border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);box-shadow:0 10px 28px rgb(0 0 0/.16);
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.fk-opts.open{display:block}
.fk-opt{padding:8px 10px;border-radius:6px;font-size:13.5px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.fk-opt:hover,.fk-opt.act{background:var(--field);color:var(--ink)}
.fk-opt.sel{font-weight:700;color:var(--accent-ink)}

/* An absurd entry must not be able to widen the widget. The hero is the one
   place a figure is set at 26px and nowrap — needed so it cannot wrap onto a
   second line and change the height — and at 320px a thirteen-digit number is
   wider than the tool itself, which pushed the whole layout sideways.

   Letting it ellipsise trades a broken layout for a visibly truncated number,
   which is the better failure: nothing shifts, and the reader can see the
   figure has been cut rather than wondering why the tool looks wrong. Real
   amounts are nowhere near this. */
.fk-hero>span{min-width:0}
/* display:block matters — max-width and overflow do nothing on an inline
   element, which is what the hero value is in some of these tools. */
.fk-hero-v,.fk-hero-s{display:block;max-width:100%;overflow:hidden;
  text-overflow:ellipsis}

/* Every other tool in the suite puts its content inside .fk-panel, which
   carries 15px of horizontal padding, so nothing in them touches the edge of
   the embed. This one is a bare table with no panel, which left its first and
   last columns flush against both edges — measured at 0px of gap against
   16px everywhere else. Matching the panels' 15px fixes that.

   Horizontal only, deliberately. Vertical padding here would change the
   widget's height, and the host page has already reserved that. The tool is
   still fluid, still flush to the top, still uncentred, and still has no
   max-width — the guideline is about not fighting the host's layout, not
   about printing text against the pixel edge. */
.fk-calc{padding:0 15px}
.fk-tbl{min-width:370px}
.fk-co{display:flex;align-items:center;gap:6px;min-width:0}
.fk-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fk-co .fk-tag2{flex:none}
/* On a phone the name absorbs whatever width the other columns leave and
   ellipsises inside it, so a long name can never push Status off the edge.
   The SME tag sits outside the ellipsis and is always shown whole. Wider
   than this, every name fits and the columns keep their natural spread. */
@media (max-width:559px){
  .fk-tbl{min-width:0}
  .fk-tbl td.co{width:100%;max-width:0}
}
.fk-tbl .mut{color:var(--muted)}
.fk-st{white-space:nowrap}
.fk-st.now{color:var(--accent-ink);font-weight:700}
.fk-st.soon{color:var(--warn-ink);font-weight:700}
/* One line, always. The stamp text changes with how many issues are left —
   "10 open or upcoming" against "None open" — and a wrapping footer would move
   the widget's height as the pool ages, which is exactly the drift the fixed
   height exists to prevent. */
.fk-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap;
  margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
  font-size:11px;color:var(--muted)}
.fk-stamp{display:flex;align-items:center;gap:7px;min-width:0}
.fk-stamp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fk-src{flex:none}
/* Attribution is the first thing to go when there is no room; the freshness
   signal is the one the reader actually needs. */
@media (max-width:560px){ .fk-src{display:none} }
.fk-stamp i{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
/* The dot answers one question only: is the data current? Green when it is,
   grey while the live list is still loading or when it is current but there
   is simply nothing open, amber when the list itself has gone stale. How MANY
   issues are open is a fact about the market and never changes the colour —
   an earlier version turned amber on a quiet week and told readers the data
   was broken when it had been refreshed that morning. */
.fk-stamp.quiet i,.fk-stamp.wait i{background:var(--muted-2)}
.fk-stamp.stale i{background:var(--warn-ink)}
.fk-stamp.stale{color:var(--warn-ink)}
/* When nothing is open, say so in the table rather than leaving five bare
   dashes, which read as a tool that failed to load. Same row height, so the
   widget does not move. Its one cell spans the row, which also makes it the
   row's last cell — left-aligned here, or it inherits the right alignment
   meant for the status/price column. */
.fk-tbl tr.fk-none td{color:var(--muted);text-align:left;white-space:nowrap}
.fk-src{color:var(--muted-2)}
</style>
</head>
<body>

<div class="fk-calc" id="fk">
  <div class="fk-head">
    <div class="fk-seg" role="tablist" aria-label="IPO list">
      <button type="button" class="fk-seg-btn active" data-view="up" role="tab">Open &amp; upcoming</button>
      <button type="button" class="fk-seg-btn" data-view="past" role="tab">Recently closed</button>
    </div>
  </div>

  <div class="fk-tblwrap">
    <table class="fk-tbl">
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="fk-meta">
    <span class="fk-stamp" id="stamp"><i></i><span id="stampTxt">—</span></span>
    <span class="fk-src">Read from SEBI public-issue filings</span>
  </div>
</div>

<script>
/* ---------------------------------------------------------------------------
   Shared helpers. Deliberately tiny and dependency-free — every tool must
   compute correctly with no network at all.
   --------------------------------------------------------------------------- */
var $ = function (id) { return document.getElementById(id); };

/* Indian digit grouping, to the rupee. Money people are going to act on is
   never abbreviated — "₹3.43 L" is a figure rounded to the nearest hundred. */
function inr(v) {
  var n = Math.round(Math.abs(v || 0));
  return (v < 0 ? '−₹' : '₹') + n.toLocaleString('en-IN');
}
/* Compact form, for axis labels and slider hints only. */
function inrShort(v) {
  var a = Math.abs(v || 0);
  if (a >= 1e7) return '₹' + (a / 1e7).toFixed(a >= 1e8 ? 0 : 2).replace(/\.00$/, '') + ' Cr';
  if (a >= 1e5) return '₹' + (a / 1e5).toFixed(a >= 1e6 ? 0 : 2).replace(/\.00$/, '') + ' L';
  if (a >= 1e3) return '₹' + Math.round(a / 1e3) + 'K';
  return '₹' + Math.round(a);
}
function num(id, fallback) {
  var v = parseFloat(($(id) || {}).value);
  return isFinite(v) ? v : (fallback || 0);
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

/** Standard reducing-balance EMI. Returns 0 for a zero-rate or empty loan. */
function emiOf(principal, annualPct, months) {
  if (!(principal > 0) || !(months > 0)) return 0;
  var i = annualPct / 12 / 100;
  if (!i) return principal / months;              // 0% is a real input, not an error
  var f = Math.pow(1 + i, months);
  return principal * i * f / (f - 1);
}

/** Months to clear a balance at a fixed payment. Infinity if it never clears. */
function monthsToClear(balance, annualPct, payment) {
  var i = annualPct / 12 / 100;
  if (!(balance > 0)) return 0;
  if (!(payment > 0)) return Infinity;
  if (!i) return Math.ceil(balance / payment);
  if (payment <= balance * i) return Infinity;    // payment does not cover interest
  return Math.ceil(-Math.log(1 - balance * i / payment) / Math.log(1 + i));
}

/**
 * Internal rate of return on a level-instalment loan, per period.
 * Bisection rather than Newton: it cannot diverge, and the bracket is known.
 */
function irrLevel(netDisbursed, instalment, n) {
  if (!(netDisbursed > 0) || !(instalment > 0) || !(n > 0)) return 0;
  if (instalment * n <= netDisbursed) return 0;     // no cost of credit
  var pv = function (r) { return r ? instalment * (1 - Math.pow(1 + r, -n)) / r : instalment * n; };
  var lo = 1e-12, hi = 1;
  for (var k = 0; k < 200; k++) {
    var mid = (lo + hi) / 2;
    if (pv(mid) > netDisbursed) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

/* Slider fill. Reads value, writes a CSS variable; never writes a value. */
function paintRange(el) {
  if (!el) return;
  var lo = parseFloat(el.min) || 0, hi = parseFloat(el.max) || 100, v = parseFloat(el.value) || 0;
  el.style.setProperty('--p', clamp(hi > lo ? (v - lo) / (hi - lo) * 100 : 0, 0, 100) + '%');
}
function paintAll() { document.querySelectorAll('.fk-range').forEach(paintRange); }

/**
 * Binds a number field to its slider. The field is authoritative and is NOT
 * clamped while typing — clamping mid-keystroke fights the user (typing "5"
 * on the way to "50000" would snap to the minimum). It settles on blur.
 */
function bind(inputId, rangeId, onChange) {
  var input = $(inputId), range = $(rangeId);
  if (!input) return;
  function fromInput() {
    if (range) {
      range.value = clamp(parseFloat(input.value) || 0, +range.min, +range.max);
      paintRange(range);
    }
    onChange();
  }
  input.addEventListener('input', fromInput);
  input.addEventListener('blur', function () {
    if (!range) return;
    var v = parseFloat(input.value);
    if (!isFinite(v)) return;
    var c = clamp(v, +range.min, +range.max);
    if (c !== v) { input.value = c; fromInput(); }
  });
  if (range) range.addEventListener('input', function () {
    input.value = range.value; paintRange(range); onChange();
  });
}

/** Two-segment donut as inline SVG — no chart library to load, cache or break. */
function donut(el, a, b, colourA, colourB) {
  var total = (a || 0) + (b || 0);
  var pct = total > 0 ? (a / total) * 100 : 0;
  var C = 2 * Math.PI * 38;
  el.innerHTML =
    '<svg viewBox="0 0 100 100" class="fk-donut" role="img" aria-hidden="true">' +
      '<circle cx="50" cy="50" r="38" stroke="' + colourB + '"></circle>' +
      '<circle cx="50" cy="50" r="38" stroke="' + colourA + '" stroke-linecap="butt"' +
        ' stroke-dasharray="' + (C * pct / 100).toFixed(2) + ' ' + C.toFixed(2) + '"></circle>' +
    '</svg>';
  return Math.round(pct);
}

/* ---- dates ------------------------------------------------------------- */
/* Parsed as UTC midnight so a timezone offset can never shift a holding
   period across the 12-month line. */
function dparse(v) {
  var p = String(v || '').split('-');
  if (p.length !== 3) return null;
  var t = Date.UTC(+p[0], +p[1] - 1, +p[2]);
  return isFinite(t) ? t : null;
}
function dval(id) { var e = $(id); return e ? dparse(e.value) : null; }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
var FKMON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dfmt(t) {
  if (t == null || !isFinite(t)) return '—';
  var d = new Date(t);
  return d.getUTCDate() + ' ' + FKMON[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
}

/**
 * Internal rate of return on irregularly dated cash flows — the XIRR every
 * spreadsheet has. Bisection rather than Newton: Newton diverges on the ragged
 * flow patterns real portfolios produce, and the bracket here is known.
 * Flows are {t: ms, v: amount}, money out negative. Returns an annual rate,
 * or null when the flows never cross zero (all one direction, say).
 */
function xirr(flows) {
  if (!flows || flows.length < 2) return null;
  var t0 = flows[0].t, i;
  for (i = 1; i < flows.length; i++) if (flows[i].t < t0) t0 = flows[i].t;
  function npv(r) {
    var s = 0;
    for (var k = 0; k < flows.length; k++) {
      s += flows[k].v / Math.pow(1 + r, (flows[k].t - t0) / 31536000000);
    }
    return s;
  }
  var lo = -0.9999, hi = 1000, flo = npv(lo), fhi = npv(hi);
  if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return null;
  for (i = 0; i < 400; i++) {
    var m = (lo + hi) / 2, fm = npv(m);
    if (!isFinite(fm)) return null;
    if (flo * fm <= 0) { hi = m; fhi = fm; } else { lo = m; flo = fm; }
  }
  return (lo + hi) / 2;
}

/** Reads a fixed block of rows, skipping blanks. ids like 'q1','p1' ... */
function readRows(n, keys) {
  var out = [];
  for (var i = 1; i <= n; i++) {
    var row = {}, any = false;
    for (var k in keys) {
      var el = $(keys[k] + i);
      var raw = el ? el.value : '';
      if (String(raw).trim() !== '') any = true;
      row[k] = keys[k].charAt(0) === 'd' ? dparse(raw) : parseFloat(raw);
    }
    if (any) out.push(row);
  }
  return out;
}

/** Rupees to the paise, Indian grouping. Charges get compared against a
    contract note, where 6.50 and 6 are visibly different numbers. */
function inr2(v) {
  var n = Math.abs(Math.round((v || 0) * 100) / 100);
  if (!isFinite(n)) n = 0;
  // toFixed switches to exponential notation at 1e21, and paise stopped
  // meaning anything long before that — fall back to whole rupees.
  if (n >= 1e15) return (v < 0 ? '−₹' : '₹') + Math.round(n).toLocaleString('en-IN');
  var s = n.toFixed(2).split('.');
  var w = s[0], last3 = w.slice(-3), rest = w.slice(0, -3);
  if (rest) last3 = ',' + last3;
  return (v < -0.004 ? '−₹' : '₹') +
    rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + last3 + '.' + s[1];
}

/* ---------------------------------------------------------------------------
   Dropdowns that stay inside the widget.

   See base.css for why: an OS-drawn <select> popup ignores CSS entirely, and
   a list of eighteen currencies ends up several times taller than a 324px
   tool. Here the popup is suppressed and a listbox is drawn inside the
   widget instead, its height capped at open time to the room actually
   available — so it can never run past the edge of the embed.

   The <select> itself is kept, transparent, on top and focusable, and stays
   the single source of truth. Tools read $('id').value and listen for
   'change' exactly as before.
   --------------------------------------------------------------------------- */
var FK_OPEN = null;

function fkCloseSelect() {
  if (!FK_OPEN) return;
  FK_OPEN.box.classList.remove('open');
  FK_OPEN = null;
}

function fkSelect(sel) {
  // Already enhanced: just resync the label, because the caller has usually
  // just rebuilt the option list from a freshly fetched payload.
  if (sel && sel.dataset.fk) { sel.fkPaint && sel.fkPaint(); return; }
  if (!sel) return;
  sel.dataset.fk = '1';
  var wrap = sel.closest('.fk-sel');
  if (!wrap) return;

  var label = document.createElement('span');
  label.className = 'fk-selval';
  wrap.insertBefore(label, sel);

  var box = document.createElement('div');
  box.className = 'fk-opts';
  box.setAttribute('role', 'listbox');
  wrap.appendChild(box);

  function paint() {
    var o = sel.options[sel.selectedIndex];
    label.textContent = o ? o.textContent : '';
  }

  function build() {
    box.innerHTML = '';
    for (var i = 0; i < sel.options.length; i++) {
      var o = sel.options[i], d = document.createElement('div');
      d.className = 'fk-opt' + (i === sel.selectedIndex ? ' sel' : '');
      d.setAttribute('role', 'option');
      d.setAttribute('aria-selected', i === sel.selectedIndex ? 'true' : 'false');
      d.textContent = o.textContent;
      d.dataset.i = i;
      box.appendChild(d);
    }
  }

  /* The whole point. The cap is whatever room the widget actually has above
     or below this field — never a fixed number, because the same component
     sits at different heights in different tools and at different widths. */
  function place() {
    var host = sel.closest('.fk-calc') || document.body;
    var hb = host.getBoundingClientRect(), fb = wrap.getBoundingClientRect();
    var below = hb.bottom - fb.bottom - 6;
    var above = fb.top - hb.top - 6;
    var up = above > below;
    var room = Math.max(24, Math.floor(up ? above : below));
    box.style.maxHeight = Math.min(room, 260) + 'px';
    if (up) { box.style.bottom = (fb.height + 4) + 'px'; box.style.top = 'auto'; }
    else    { box.style.top = (fb.height + 4) + 'px'; box.style.bottom = 'auto'; }
  }

  function open() {
    if (FK_OPEN && FK_OPEN.box !== box) fkCloseSelect();
    build(); place();
    box.classList.add('open');
    FK_OPEN = { box: box, sel: sel };
    var cur = box.querySelector('.sel');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }

  function choose(i) {
    if (i == null || i < 0 || i >= sel.options.length) return;
    sel.selectedIndex = i;
    paint();
    sel.dispatchEvent(new Event('change', { bubbles: true }));
    fkCloseSelect();
  }

  // Suppress the OS popup without losing focus or keyboard access.
  sel.addEventListener('mousedown', function (e) {
    e.preventDefault();
    sel.focus();
    FK_OPEN && FK_OPEN.box === box ? fkCloseSelect() : open();
  });
  sel.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'Escape') { fkCloseSelect(); return; }
    if (!FK_OPEN || FK_OPEN.box !== box) {
      if (k === 'Enter' || k === ' ' || k === 'ArrowDown' || k === 'ArrowUp') {
        e.preventDefault(); open();
      }
      return;
    }
    if (k === 'Enter' || k === ' ') { e.preventDefault(); choose(sel.selectedIndex); }
  });
  // Arrow keys still move the native selection; keep the list in step.
  sel.addEventListener('change', function () {
    paint();
    if (FK_OPEN && FK_OPEN.box === box) { build(); var c = box.querySelector('.sel');
      if (c) c.scrollIntoView({ block: 'nearest' }); }
  });
  box.addEventListener('mousedown', function (e) {
    var t = e.target.closest('.fk-opt');
    if (!t) return;
    e.preventDefault();
    choose(parseInt(t.dataset.i, 10));
  });

  sel.fkPaint = paint;
  paint();
}

function fkSelectAll() {
  document.querySelectorAll('.fk-sel select').forEach(fkSelect);
}

document.addEventListener('mousedown', function (e) {
  if (FK_OPEN && !e.target.closest('.fk-sel')) fkCloseSelect();
});
window.addEventListener('resize', fkCloseSelect);

</script>
<script>

       the data updates without financekeeda.com deploying anything. Paste
       the widget once and it keeps itself current.

       Falls back to the pool baked in below if the request fails, so a CDN
       blip or an offline reader still sees a working tool.

       Needs the repository to be public — jsDelivr will not serve a private
       one. Swap this for a plain 'ipos.json' to go back to reading a file
       deployed beside the widget. */
    dataUrl: 'https://cdn.jsdelivr.net/gh/Shashank-95/financekeeda-tools@main/public/tools/ipo-tracker/ipos.json',
    rows: 5
  };

  /* One pool. Every entry carries its own dates, and the tool decides which

      { name: 'ArMee Infotech',               kind: 'Mainboard', open: '2026-09-23', close: '2026-09-25', stage: 'rhp', doc: 'https://www.sebi.gov.in/filings/public-issues/sep-2026/armee-infotech-limited-rhp_104661.html' },

      { name: 'Sonaselection India',          kind: 'Mainboard', open: '2026-09-17', close: '2026-09-21', stage: 'rhp', doc: 'https://www.sebi.gov.in/filings/public-issues/sep-2026/sonaselection-india-limited-rhp_104393.html' },

      { name: 'SS Retail',                    kind: 'Mainboard', open: '2026-09-16', close: '2026-09-18', price: 424, stage: 'final', doc: 'https://www.sebi.gov.in/filings/public-issues/sep-2026/ss-retail-limited-prospectus_104599.html' },
      { name: 'Hero Motors',                  kind: 'Mainboard', open: '2026-09-16', close: '2026-09-18', price: 84, stage: 'final', doc: 'https://www.sebi.gov.in/filings/public-issues/sep-2026/hero-motors-limited-prospectus_104589.html' },
      { name: 'Manika Plastech',              kind: 'Mainboard', open: '2026-09-11', close: '2026-09-16', price: 43, stage: 'final', doc: 'https://www.sebi.gov.in/filings/public-issues/sep-2026/manika-plastech-limited-prospectus_104534.html' },
      { name: 'Veegaland Developers',         kind: 'Mainboard', open: '2026-09-10', close: '2026-09-15', price: 140, stage: 'final', doc: 'https://www.sebi.gov.in/filings/public-issues/sep-2026/veegaland-developers-limited-prospectus_104504.html' },
      { name: 'Asset Reconstruction…',        kind: 'Mainboard', open: '2026-09-09', close: '2026-09-11', stage: 'rhp', doc: 'https://www.sebi.gov.in/filings/public-issues/sep-2026/asset-reconstruction-company-india-limited-rhp_104202.html' }
    ]
  };

  var view = 'up';
  var DAY = 86400000;

  /* The refresh job runs twice a day and stamps the file with the date it
     ran. A day old is normal; three days with no new stamp means the job has
     stopped, and only then does the tool say the list may be out of date. */
  var FRESH_DAYS = 3;

  /* Until the live fetch has either landed or failed, the baked pool above
     is a placeholder, not a verdict. Without this, a stale baked copy would
     flash "may be out of date" in amber on every page load for the second or
     two before the live list arrived. */
  var settled = !CONFIG.dataUrl;

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shortDate(iso) {
    var t = dparse(iso);
    if (t == null) return '—';
    var d = new Date(t);
    return d.getUTCDate() + ' ' + FKMON[d.getUTCMonth()];
  }
  /* "22–24 Sep", or "29 Sep–1 Oct" across a month end. On a phone the two
     date columns become this one, which is what leaves room for Status. */
  function dateRange(a, b) {
    var o = dparse(a), c = dparse(b);
    if (o == null || c == null) return shortDate(a) + '–' + shortDate(b);
    var x = new Date(o), y = new Date(c);
    return x.getUTCMonth() === y.getUTCMonth()
      ? x.getUTCDate() + '–' + shortDate(b)
      : shortDate(a) + '–' + shortDate(b);
  }

  /* Under 560px four columns do not fit: on a 375px phone Status — the one
     column a reader actually came for — was pushed off-screen behind a
     sideways scroll. Narrow layouts get three columns instead. */
  var NARROW = window.matchMedia ? window.matchMedia('(max-width:559px)') : null;
  function narrow() { return !!(NARROW && NARROW.matches); }

  /** Today at UTC midnight, so an issue closing today still counts as open. */
  function today() {
    var n = new Date();
    return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
  }

  /* The only thing here a filing does not state outright, and the one a
     reader actually wants: can I apply right now, and if not, when? */
  function status(x, t) {
    var o = dparse(x.open), c = dparse(x.close);
    if (o == null) return { txt: '—', cls: '' };
    if (o > t) {
      var n = Math.round((o - t) / DAY);
      return { txt: n === 1 ? 'Opens tomorrow' : 'Opens in ' + n + ' days', cls: '' };
    }
    if (c != null && c <= t) return { txt: 'Last day', cls: 'soon' };
    return { txt: 'Open now', cls: 'now' };
  }

  /* Mainboard is all but every issue SEBI lists, so naming it on every row
     would be a column of one repeated word. An SME issue is the exception
     and is worth flagging, so it is tagged inline and nothing else is. */
  function nameCell(x) {
    // On a phone "BSE SME" shortens to "SME": the exchange matters less than
    // the company name it would otherwise crowd out.
    var kind = x.kind && x.kind !== 'Mainboard'
      ? (narrow() ? 'SME' : x.kind) : '';
    var tag = kind ? '<span class="fk-tag2">' + esc(kind) + '</span>' : '';
    return '<td class="co"><span class="fk-co"><span class="fk-nm" title="' +
      esc(x.name) + '">' + esc(x.name) + '</span>' + tag + '</span></td>';
  }

  /* The whole rotation, in one function. Nothing is stored as "upcoming" or
     "past" — those are just which side of today an entry lands on. */
  function partition(pool) {
    var t = today(), up = [], past = [];
    (pool.ipos || []).forEach(function (x) {
      var close = dparse(x.close);
      if (close == null) return;
      if (close >= t) up.push(x); else past.push(x);
    });
    // Closing soonest first — that is the one you have least time to act on.
    // Ties broken by name, so the same data always renders in the same order
    // rather than rows swapping places between page loads.
    up.sort(function (a, b) {
      return (dparse(a.close) - dparse(b.close)) || String(a.name).localeCompare(String(b.name));
    });
    // Most recently finished first.
    past.sort(function (a, b) {
      return (dparse(b.close) - dparse(a.close)) || String(a.name).localeCompare(String(b.name));
    });
    return { up: up, past: past, today: t };
  }

  function render(pool) {
    var part = partition(pool), head, rows = [], list, i;

    var nw = narrow();
    function dates(x) {
      return nw ? '<td>' + dateRange(x.open, x.close) + '</td>'
                : '<td>' + shortDate(x.open) + '</td><td>' + shortDate(x.close) + '</td>';
    }

    if (view === 'up') {
      head = nw ? ['Company', 'Dates', 'Status'] : ['Company', 'Opens', 'Closes', 'Status'];
      list = part.up.slice(0, CONFIG.rows);
      for (i = 0; i < list.length; i++) {
        var u = list[i], st = status(u, part.today);
        rows.push('<tr>' + nameCell(u) + dates(u) +
          '<td class="fk-st ' + st.cls + '">' + st.txt + '</td></tr>');
      }
    } else {
      head = nw ? ['Company', 'Dates', 'Issue price'] : ['Company', 'Opened', 'Closed', 'Issue price'];
      list = part.past.slice(0, CONFIG.rows);
      for (i = 0; i < list.length; i++) {
        var p = list[i];
        // The final price is only fixed once the Prospectus is filed, a few
        // days after the book closes. Saying so beats an unexplained dash.
        var px = p.price != null
          ? inr(p.price)
          : '<span class="mut">' + (nw ? 'awaiting' : 'awaiting filing') + '</span>';
        rows.push('<tr>' + nameCell(p) + dates(p) +
          '<td>' + px + '</td></tr>');
      }
    }

    // Nothing to show: say so in words, in the first row, instead of five
    // bare dashes that look like the tool failed to load.
    if (!rows.length) {
      rows.push('<tr class="empty fk-none"><td colspan="' + head.length + '">' +
        (view === 'up' ? 'No IPOs open or upcoming right now'
                       : 'No recently closed IPOs to show') + '</td></tr>');
    }
    // Always five rows: a table that shrinks with the data shrinks the widget,
    // and the host has already reserved the height.
    while (rows.length < CONFIG.rows) {
      rows.push('<tr class="empty"><td>—</td>' +
        new Array(head.length).join('<td></td>') + '</tr>');
    }
    $('thead').innerHTML = head.map(function (h) { return '<th>' + h + '</th>'; }).join('');
    $('tbody').innerHTML = rows.join('');

    paintStamp(pool, part);
  }

  /* Two separate questions, deliberately kept apart.

       Is the list current?   Answered by the date the refresh job last ran.
       How many are open?     Answered by the list, and a fact about the
                              market, not about the data.

     An earlier version answered only the second and used it as a proxy for
     the first: it went amber with "the list needs refreshing" whenever
     nothing was open, which on 3 October 2026 told readers a list refreshed
     that very morning was broken — SEBI simply had no new filings. It also
     never went amber when the list really was old, as long as it still held
     a few future-dated issues. */
  function paintStamp(pool, part) {
    var st = $('stamp'), n = part.up.length;
    var upd = dparse(pool.updated);
    var age = upd == null ? Infinity : Math.round((part.today - upd) / DAY);
    var count = n === 0 ? 'None open or upcoming'
              : n === 1 ? '1 open or upcoming'
              : n + ' open or upcoming';
    var cls, txt;

    if (age > FRESH_DAYS && !settled) {
      // The baked copy is old and the live list has not answered yet.
      cls = 'fk-stamp wait';
      txt = 'Checking for the latest list…';
    } else if (age > FRESH_DAYS) {
      cls = 'fk-stamp stale';
      txt = upd == null ? 'List date unknown — may be out of date'
                        : 'List from ' + dfmt(upd) + ' — may be out of date';
    } else {
      cls = 'fk-stamp' + (n === 0 ? ' quiet' : '');
      txt = count + ' · updated ' + dfmt(upd);
    }
    st.className = cls;
    $('stampTxt').textContent = txt;
  }

  var DATA = POOL;
  document.querySelectorAll('.fk-seg-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.fk-seg-btn').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      view = b.dataset.view;
      render(DATA);
    });
  });

  render(DATA);
  if (NARROW) {
    var relayout = function () { render(DATA); };
    if (NARROW.addEventListener) NARROW.addEventListener('change', relayout);
    else if (NARROW.addListener) NARROW.addListener(relayout);   // Safari < 14
  }

  /* Top the pool up from your own endpoint if one is configured. Failure is
     silent: the baked pool is already rendered and still rotating. */
  if (CONFIG.dataUrl) {
    /* Busted once a day, not on every view. A CDN is free to cache the file
       hard, which is what you want — but not so hard that a refresh takes a
       week to reach readers. */
    var stamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    var url = CONFIG.dataUrl + (CONFIG.dataUrl.indexOf('?') < 0 ? '?' : '&') + 'd=' + stamp;

    /* Whatever happens — the list arrives, the request fails, or it simply
       hangs — the stamp stops saying "checking" and says what it knows. */
    // Renders every time it is called: a list that lands after the timeout
    // has already fired must still replace what is on screen.
    var settle = function () {
      settled = true;
      render(DATA);
    };
    var timer = setTimeout(settle, 8000);

    fetch(url, { credentials: 'omit' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) {
        // Never step backwards: a CDN edge still holding yesterday's file
        // must not replace a newer list already baked into the page.
        var live = d && d.ipos && d.ipos.length ? dparse(d.updated) : null;
        var baked = dparse(DATA.updated);
        if (live != null && (baked == null || live >= baked)) DATA = d;
      })
      .catch(function () { /* baked pool stands */ })
      .then(function () { clearTimeout(timer); settle(); });
  }
})();
</script>
</body>
</html>
