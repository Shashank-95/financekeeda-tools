<title>Currency Converter</title>

<!--
  ==========================================================================
  FINANCE KEEDA — Currency Converter
  ==========================================================================
  Generated by build/shell.py from build/tools/converter.html. Do not edit by hand.

  --------------------------------------------------------------------------
  WHY THIS IS NOT JUST A CONVERTER
  --------------------------------------------------------------------------
  Every converter on the internet multiplies by the interbank rate and stops.
  Nobody is ever offered the interbank rate. Between it and the reader's bank
  statement sit two things they cannot see:

    a margin      1.5-3.5% at a bank counter, less online. Not a fee on the
                  statement — it is baked into the rate quoted, which is
                  exactly why it goes unnoticed
    GST           on the conversion itself, on a slab under Rule 32(2)(b) of
                  the CGST Rules, not a flat percentage

  So the honest answer to "what will I get for a lakh" is several thousand
  rupees away from rate x amount. This tool shows both numbers and the gap
  between them, because the gap is the part worth knowing.

  --------------------------------------------------------------------------
  THE GST SLAB, VERBATIM FROM RULE 32(2)(b)
  --------------------------------------------------------------------------
  The taxable value of the conversion service is:

    up to Rs 1 lakh        1% of the gross amount, minimum Rs 250
    Rs 1 lakh - 10 lakh    Rs 1,000 + 0.5% of the amount above Rs 1 lakh
    above Rs 10 lakh       Rs 5,500 + 0.1% of the amount above Rs 10 lakh,
                           capped at Rs 60,000

  GST at 18% applies to that value, not to the amount exchanged. So the most
  GST any single conversion can attract is Rs 10,800, and on a small exchange
  the Rs 250 minimum dominates — a Rs 5,000 conversion is taxed on Rs 250,
  not on Rs 50. Both ends surprise people, which is why the slab is shown.

  The slabs join up exactly at their boundaries (1% of 1 lakh = Rs 1,000;
  Rs 1,000 + 0.5% of 9 lakh = Rs 5,500), so there is no jump at the seams.

  --------------------------------------------------------------------------
  RATES
  --------------------------------------------------------------------------
  ECB reference rates, cited as the source, crossed through the euro. Never
  called the RBI reference rate — that is FBIL's licensed benchmark and this
  is deliberately not it. See build/fetch_ecb.py.

  --------------------------------------------------------------------------
  NO HEADING INSIDE THE TOOL — the host page supplies it.
  NO CONTAINER SPACING, MAX WIDTH OR CENTRING — it fills the box it is given
  and starts at its top-left corner.
  FIXED HEIGHT — nothing a reader can do changes it. Two values, because the
  two-column layout stacks below 821px and a single height cannot serve both
  without either clipping the phone or leaving a hole on the desktop. Within
  each band the height is constant, whatever the reader types or drags.

      <style>
        .fk-embed-currency-converter{width:100%;border:0;display:block;height:680px}
        @media (min-width:821px){ .fk-embed-currency-converter{height:324px} }
      </style>
      <iframe class="fk-embed-currency-converter" src="/tools/currency-converter.html"
              title="Currency Converter" loading="lazy" scrolling="no"></iframe>
  ==========================================================================
-->

<style>
/* ---------------------------------------------------------------------------
   Shared foundation for every Finance Keeda banking tool.
   Tokens lifted from financekeeda.com/mutual-funds so all the tools across the
   site read as one system.
   --------------------------------------------------------------------------- */
.fk-calc{
  --surface:#fff; --border:#e9e9e9; --border-strong:#dfdfdf; --line:#f0f1f3;
  --ink:#000; --ink-2:#2d2d2d; --ink-3:#474747; --muted:#6b7280; --muted-2:#9aa1ab;
  --field:#f1f2f4;
  --accent:#37c705; --accent-ink:#227a05; --accent-soft:#f0fbeb;
  --neg:#d1242f; --neg-soft:#fdf0f0;
  --warn-bg:#fff8e8; --warn-ink:#7a5a00; --warn-bd:#f3e3ba;
  --f1:#1E4B87; --f2:#C4823C; --f3:#7E4674;
  --f1-soft:#eef3fa;
  --radius:12px; --radius-sm:8px;
  --ui:"Rubik",-apple-system,system-ui,"Segoe UI","Liberation Sans",sans-serif;
  --display:"Source Serif 4",Georgia,serif;
  --focus:0 0 0 3px rgb(55 199 5 / .28);
}

/* Host owns placement: no spacing, no max width, no centring. */
html,body{margin:0;padding:0}
body{background:var(--surface,#fff)}
.fk-calc,.fk-calc *,.fk-calc *::before,.fk-calc *::after{box-sizing:border-box}
.fk-calc{
  font-family:var(--ui);font-size:14px;color:var(--ink);
  -webkit-font-smoothing:antialiased;
  width:100%;margin:0;padding:0;background:transparent;
}

/* ---- segmented control ---- */
.fk-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;margin-bottom:12px}
.fk-seg{display:flex;gap:4px;padding:4px;background:var(--field);border-radius:11px;
  max-width:100%;overflow-x:auto;scrollbar-width:none}
.fk-seg::-webkit-scrollbar{display:none}
.fk-seg-btn{
  appearance:none;border:0;background:none;font-family:var(--ui);
  font-size:13px;font-weight:600;color:var(--muted);
  padding:9px 16px;border-radius:8px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s,box-shadow .15s;
}
.fk-seg-btn:hover{color:var(--ink-2)}
.fk-seg-btn.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.09)}
.fk-seg-btn:focus-visible{outline:none;box-shadow:var(--focus)}

/* ---- layout ---- */
.fk-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:14px;align-items:stretch}
.fk-panel{
  border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 15px;background:var(--surface);min-width:0;
  display:flex;flex-direction:column;
}
.fk-grid>.fk-panel:first-child{justify-content:space-between}

/* ---- inputs ---- */
.fk-field{margin-bottom:12px}
.fk-field:last-child{margin-bottom:0}
.fk-lab{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.fk-lab label{font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted)}
.fk-lab .hint{font-size:10.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.fk-box{
  display:flex;align-items:center;gap:8px;min-width:0;
  background:var(--field);border:1.5px solid transparent;border-radius:var(--radius-sm);
  padding:0 12px;height:46px;
  transition:border-color .14s,background .14s,box-shadow .14s;
}
.fk-box:focus-within{background:var(--surface);border-color:var(--ink);box-shadow:var(--focus)}
.fk-unit{flex:none;font-size:14px;font-weight:600;color:var(--muted)}
/* Stretched to the full box height so the whole field is the tap target —
   a 20px input inside a 46px box means three quarters of what looks tappable
   isn't. */
.fk-box input{
  flex:1;min-width:0;align-self:stretch;background:none;border:0;outline:none;
  font-family:var(--ui);font-size:16.5px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;-moz-appearance:textfield;
}
.fk-box input::-webkit-outer-spin-button,
.fk-box input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* Two short inputs on one row. Separately they cost a whole field of height
   each for very little information, and that height is dead space: the results
   panel opposite is shorter than four stacked fields, so every field removed
   from the left closes a gap on the right as well as shortening the tool.
   min-width:0 because a grid item defaults to min-width:auto, which lets the
   boxes push past the panel on a phone. */
.fk-pair{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:12px}
.fk-pair .fk-field{margin-bottom:0;min-width:0}

/* Black fill on a grey track — matches the site's other controls.
   The input is 20px tall so it is grabbable on a phone, while the visible
   track stays 6px: a 6px-tall input is almost impossible to hit with a thumb,
   and growing the whole control instead would add height to every field. */
.fk-range{
  -webkit-appearance:none;appearance:none;display:block;width:100%;
  height:20px;margin:2px 0 0;padding:0;outline:none;cursor:pointer;background:transparent;
}
.fk-range::-webkit-slider-runnable-track{
  height:6px;border-radius:99px;
  background:linear-gradient(to right,var(--ink) 0 var(--p,0%),#e4e7eb var(--p,0%) 100%);
}
.fk-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;
  border:3px solid var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.22);cursor:grab;margin-top:-6px;
}
.fk-range::-moz-range-track{height:6px;border-radius:99px;background:#e4e7eb}
.fk-range::-moz-range-progress{height:6px;border-radius:99px;background:var(--ink)}
.fk-range::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--ink);
  box-shadow:0 1px 3px rgb(0 0 0/.22);cursor:grab;
}
.fk-range:active::-webkit-slider-thumb{cursor:grabbing}
.fk-range:focus-visible{box-shadow:var(--focus)}

/* ---- results ---- */
.fk-res{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.fk-card{background:var(--field);border-radius:var(--radius-sm);padding:11px 12px;min-width:0}
.fk-card small{display:block;font-size:9.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.fk-amt{font-size:17px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fk-card.total{grid-column:span 2;background:var(--accent-soft);border:1px solid #d8f0cd;padding:14px}
.fk-card.total.warn{background:var(--warn-bg);border-color:var(--warn-bd)}
.fk-card.total.bad{background:var(--neg-soft);border-color:#f3d3d4}
.fk-card.total .fk-amt{font-size:24px;letter-spacing:-.01em}
.fk-sub{margin-top:5px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fk-sub b{font-weight:700;color:var(--accent-ink)}
.fk-sub b.bad{color:var(--neg)}

dl{margin:0}
.fk-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:5px 0;font-size:12.5px}
.fk-line dt{color:var(--ink-3);min-width:0}
.fk-line dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.fk-line.mut dt,.fk-line.mut dd{color:var(--muted)}
.fk-line.pos dd{color:var(--accent-ink)}
.fk-line.neg dd{color:var(--neg)}
.fk-rule{border-top:1px solid var(--line);margin:5px 0}

/* ---- donut, drawn inline: no chart library, so nothing to load or fail ---- */
.fk-viz{display:flex;align-items:center;gap:14px;margin-top:auto;padding-top:10px}
.fk-donut{flex:none;width:104px;height:104px}
.fk-donut circle{fill:none;stroke-width:13;transform:rotate(-90deg);transform-origin:50% 50%}
.fk-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.fk-leg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);min-width:0}
.fk-dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.fk-leg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fk-leg b{font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- notice ---- */
/* ---- closing note ----
   A block of prose whose wording changes with the inputs will wrap to a
   different number of lines and take the tool's height with it. So the slot is
   sized by a hidden copy of the LONGEST text it can ever hold, stacked in the
   same grid cell as the live text: the cell takes the taller of the two and is
   therefore exact at every width, with no magic em value to re-guess whenever
   the copy changes. */
.fk-slot{display:grid;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.fk-slot>*{grid-area:1/1;margin:0;font-size:11px;line-height:1.5;color:var(--muted)}
.fk-slot .ghost{visibility:hidden;pointer-events:none}
.fk-slot b{font-weight:600;color:var(--ink-3)}

@media (max-width:820px){
  .fk-grid{grid-template-columns:1fr}
  .fk-seg{width:100%}
  .fk-seg-btn{flex:1;min-height:40px}
  .fk-box{height:48px}
  .fk-box input{font-size:17px}
}

/* ==========================================================================
   STOCKS ADDITIONS
   ========================================================================== */

/* ---- select, matched to .fk-box ----
   Native <select> because its popup is browser chrome: it renders outside the
   iframe instead of being clipped by it. A CSS dropdown inside a fixed-height
   widget cannot do that. */
.fk-sel{position:relative;display:flex;align-items:center;min-width:0;
  background:var(--field);border:1.5px solid transparent;border-radius:var(--radius-sm);
  height:46px;padding:0 12px;transition:border-color .14s,background .14s,box-shadow .14s}
.fk-sel:focus-within{background:var(--surface);border-color:var(--ink);box-shadow:var(--focus)}
.fk-sel select{appearance:none;-webkit-appearance:none;background:none;border:0;outline:none;
  width:100%;height:100%;font-family:var(--ui);font-size:15px;font-weight:700;color:var(--ink);
  cursor:pointer;padding-right:18px;text-overflow:ellipsis}
.fk-sel::after{content:"";position:absolute;right:14px;width:7px;height:7px;pointer-events:none;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:translateY(-3px) rotate(45deg)}

/* ---- compact repeated rows (lots, cash flows) ----
   A fixed number of rows, always rendered. Blank rows are ignored by the
   maths, so the reader adds what they have and the tool never changes height. */
.fk-rows{display:grid;gap:7px}
.fk-rhead,.fk-row{display:grid;gap:7px;align-items:center}
.fk-rhead span{font-size:9.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted-2);white-space:nowrap;overflow:hidden}
.fk-mini{display:flex;align-items:center;gap:6px;min-width:0;
  background:var(--field);border:1.5px solid transparent;border-radius:var(--radius-sm);
  padding:0 10px;height:42px;transition:border-color .14s,background .14s,box-shadow .14s}
.fk-mini:focus-within{background:var(--surface);border-color:var(--ink);box-shadow:var(--focus)}
.fk-mini .u{flex:none;font-size:12px;font-weight:600;color:var(--muted)}
.fk-mini input{flex:1;min-width:0;align-self:stretch;background:none;border:0;outline:none;
  font-family:var(--ui);font-size:14.5px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.fk-mini input::-webkit-outer-spin-button,
.fk-mini input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fk-mini input[type=date]{font-size:13px;font-weight:600;min-width:0}
.fk-mini input[type=date]::-webkit-calendar-picker-indicator{padding:0;margin:0;opacity:.45;cursor:pointer}

/* ---- data table ----
   Scrolls sideways rather than wrapping: a wrapped cell changes the row
   height, and the row height is what holds the widget steady. */
.fk-tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fk-tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:600px}
.fk-tbl th{text-align:left;font-size:9.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted-2);padding:0 12px 8px 0;white-space:nowrap}
.fk-tbl td{padding:0 12px 0 0;height:38px;border-top:1px solid var(--line);
  white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.fk-tbl th:last-child,.fk-tbl td:last-child{padding-right:0;text-align:right}
.fk-tbl .co{color:var(--ink);font-weight:600}
.fk-tbl .up{color:var(--accent-ink);font-weight:600}
.fk-tbl .dn{color:var(--neg);font-weight:600}
.fk-tbl .empty td{color:var(--muted-2)}
.fk-tag2{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.04em;
  padding:2px 5px;border-radius:3px;background:var(--field);color:var(--muted);vertical-align:1px}

@media (max-width:820px){
  .fk-mini{height:44px}
  .fk-sel{height:48px}
}

.fk-swap{display:grid;grid-template-columns:1fr 40px 1fr;gap:8px;align-items:end;margin-bottom:12px}
.fk-swapbtn{align-self:end;height:46px;width:40px;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);
  cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0}
.fk-swapbtn:hover{color:var(--ink);border-color:var(--border-strong)}
.fk-swapbtn:focus-visible{outline:none;box-shadow:var(--focus)}
.fk-hero{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:10px;
  background:var(--accent-soft);border:1px solid #d8f0cd}
.fk-hero-l{font-size:9.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted)}
.fk-hero-v{white-space:nowrap;font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;line-height:1;color:var(--accent-ink)}
.fk-hero-s{margin-top:3px;font-size:11.5px;color:var(--muted);text-align:right;
  white-space:nowrap;min-height:1.4em}
.fk-slot{display:grid;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.fk-slot>*{grid-area:1/1;margin:0;font-size:11px;line-height:1.5;color:var(--muted)}
.fk-slot .ghost{visibility:hidden;pointer-events:none}
.fk-slot b{font-weight:700;color:var(--ink-3)}
</style>

<body>

<div class="fk-calc" id="fk">
  <div class="fk-grid">
    <div class="fk-panel">
      <div class="fk-field">
        <div class="fk-lab"><label for="amt">You are exchanging</label></div>
        <div class="fk-box"><span class="u" id="u-amt">₹</span>
          <input type="number" id="amt" value="100000" inputmode="decimal" aria-label="Amount"></div>
      </div>

      <div class="fk-swap">
        <div class="fk-field" style="margin-bottom:0">
          <div class="fk-lab"><label for="from">From</label></div>
          <div class="fk-sel"><select id="from" aria-label="From currency"></select></div>
        </div>
        <button type="button" class="fk-swapbtn" id="swap" aria-label="Swap currencies">⇄</button>
        <div class="fk-field" style="margin-bottom:0">
          <div class="fk-lab"><label for="to">To</label></div>
          <div class="fk-sel"><select id="to" aria-label="To currency"></select></div>
        </div>
      </div>

      <div class="fk-field">
        <div class="fk-lab"><label>Where are you exchanging it</label></div>
        <div class="fk-seg" role="group" aria-label="Where">
          <button type="button" class="fk-seg-btn active" data-mk="1.8">Bank</button>
          <button type="button" class="fk-seg-btn" data-mk="1.2">Forex card</button>
          <button type="button" class="fk-seg-btn" data-mk="0.5">Online</button>
        </div>
      </div>

      <div class="fk-field">
        <div class="fk-lab"><label for="mk">Margin over the market rate</label>
          <span class="fk-val" id="r-mk">1.8%</span></div>
        <div class="fk-box"><input type="number" id="mk" value="1.8" step="0.1" inputmode="decimal"
          aria-label="Margin percent"><span class="u">%</span></div>
      </div>
    </div>

    <div class="fk-panel">
      <div class="fk-hero">
        <span class="fk-hero-l">You<br>actually get</span>
        <span>
          <span class="fk-hero-v" id="o-get">—</span>
          <div class="fk-hero-s" id="o-get-s">—</div>
        </span>
      </div>

      <dl style="margin:0">
        <div class="fk-line mut"><dt id="lab-mkt">Market rate</dt><dd id="o-mkt">—</dd></div>
        <div class="fk-line mut"><dt>Your rate after margin</dt><dd id="o-rate">—</dd></div>
        <div class="fk-rule"></div>
        <div class="fk-line"><dt>Margin</dt><dd id="o-mkc">—</dd></div>
        <div class="fk-line"><dt id="lab-gst">GST on the conversion</dt><dd id="o-gst">—</dd></div>
        <div class="fk-line neg"><dt>What it costs you</dt><dd id="o-cost">—</dd></div>
      </dl>

      <!-- The ghost reserves the height, so it must be at least as long as
           the longest message below can get: the widest percentage, plus the
           wordiest of the four GST slab descriptions. If a real variant ever
           overruns it, that variant sets the height instead and the widget
           jumps as the reader types. -->
      <div class="fk-slot">
        <p class="ghost">You lose 00.00% to the margin and GST. The margin is inside the rate
          you are quoted, not a line on your statement. GST here is ₹5,500 + 0.1% of the
          amount over ₹10 lakh.</p>
        <p id="foot"></p>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------------------
   Shared helpers. Deliberately tiny and dependency-free — every tool must
   compute correctly with no network at all.
   --------------------------------------------------------------------------- */
var $ = function (id) { return document.getElementById(id); };

/* Indian digit grouping, to the rupee. Money people are going to act on is
   never abbreviated — "₹3.43 L" is a figure rounded to the nearest hundred. */
function inr(v) {
  var n = Math.round(Math.abs(v || 0));
  return (v < 0 ? '−₹' : '₹') + n.toLocaleString('en-IN');
}
/* Compact form, for axis labels and slider hints only. */
function inrShort(v) {
  var a = Math.abs(v || 0);
  if (a >= 1e7) return '₹' + (a / 1e7).toFixed(a >= 1e8 ? 0 : 2).replace(/\.00$/, '') + ' Cr';
  if (a >= 1e5) return '₹' + (a / 1e5).toFixed(a >= 1e6 ? 0 : 2).replace(/\.00$/, '') + ' L';
  if (a >= 1e3) return '₹' + Math.round(a / 1e3) + 'K';
  return '₹' + Math.round(a);
}
function num(id, fallback) {
  var v = parseFloat(($(id) || {}).value);
  return isFinite(v) ? v : (fallback || 0);
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

/** Standard reducing-balance EMI. Returns 0 for a zero-rate or empty loan. */
function emiOf(principal, annualPct, months) {
  if (!(principal > 0) || !(months > 0)) return 0;
  var i = annualPct / 12 / 100;
  if (!i) return principal / months;              // 0% is a real input, not an error
  var f = Math.pow(1 + i, months);
  return principal * i * f / (f - 1);
}

/** Months to clear a balance at a fixed payment. Infinity if it never clears. */
function monthsToClear(balance, annualPct, payment) {
  var i = annualPct / 12 / 100;
  if (!(balance > 0)) return 0;
  if (!(payment > 0)) return Infinity;
  if (!i) return Math.ceil(balance / payment);
  if (payment <= balance * i) return Infinity;    // payment does not cover interest
  return Math.ceil(-Math.log(1 - balance * i / payment) / Math.log(1 + i));
}

/**
 * Internal rate of return on a level-instalment loan, per period.
 * Bisection rather than Newton: it cannot diverge, and the bracket is known.
 */
function irrLevel(netDisbursed, instalment, n) {
  if (!(netDisbursed > 0) || !(instalment > 0) || !(n > 0)) return 0;
  if (instalment * n <= netDisbursed) return 0;     // no cost of credit
  var pv = function (r) { return r ? instalment * (1 - Math.pow(1 + r, -n)) / r : instalment * n; };
  var lo = 1e-12, hi = 1;
  for (var k = 0; k < 200; k++) {
    var mid = (lo + hi) / 2;
    if (pv(mid) > netDisbursed) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

/* Slider fill. Reads value, writes a CSS variable; never writes a value. */
function paintRange(el) {
  if (!el) return;
  var lo = parseFloat(el.min) || 0, hi = parseFloat(el.max) || 100, v = parseFloat(el.value) || 0;
  el.style.setProperty('--p', clamp(hi > lo ? (v - lo) / (hi - lo) * 100 : 0, 0, 100) + '%');
}
function paintAll() { document.querySelectorAll('.fk-range').forEach(paintRange); }

/**
 * Binds a number field to its slider. The field is authoritative and is NOT
 * clamped while typing — clamping mid-keystroke fights the user (typing "5"
 * on the way to "50000" would snap to the minimum). It settles on blur.
 */
function bind(inputId, rangeId, onChange) {
  var input = $(inputId), range = $(rangeId);
  if (!input) return;
  function fromInput() {
    if (range) {
      range.value = clamp(parseFloat(input.value) || 0, +range.min, +range.max);
      paintRange(range);
    }
    onChange();
  }
  input.addEventListener('input', fromInput);
  input.addEventListener('blur', function () {
    if (!range) return;
    var v = parseFloat(input.value);
    if (!isFinite(v)) return;
    var c = clamp(v, +range.min, +range.max);
    if (c !== v) { input.value = c; fromInput(); }
  });
  if (range) range.addEventListener('input', function () {
    input.value = range.value; paintRange(range); onChange();
  });
}

/** Two-segment donut as inline SVG — no chart library to load, cache or break. */
function donut(el, a, b, colourA, colourB) {
  var total = (a || 0) + (b || 0);
  var pct = total > 0 ? (a / total) * 100 : 0;
  var C = 2 * Math.PI * 38;
  el.innerHTML =
    '<svg viewBox="0 0 100 100" class="fk-donut" role="img" aria-hidden="true">' +
      '<circle cx="50" cy="50" r="38" stroke="' + colourB + '"></circle>' +
      '<circle cx="50" cy="50" r="38" stroke="' + colourA + '" stroke-linecap="butt"' +
        ' stroke-dasharray="' + (C * pct / 100).toFixed(2) + ' ' + C.toFixed(2) + '"></circle>' +
    '</svg>';
  return Math.round(pct);
}

/* ---- dates ------------------------------------------------------------- */
/* Parsed as UTC midnight so a timezone offset can never shift a holding
   period across the 12-month line. */
function dparse(v) {
  var p = String(v || '').split('-');
  if (p.length !== 3) return null;
  var t = Date.UTC(+p[0], +p[1] - 1, +p[2]);
  return isFinite(t) ? t : null;
}
function dval(id) { var e = $(id); return e ? dparse(e.value) : null; }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
var FKMON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dfmt(t) {
  if (t == null || !isFinite(t)) return '—';
  var d = new Date(t);
  return d.getUTCDate() + ' ' + FKMON[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
}

/**
 * Internal rate of return on irregularly dated cash flows — the XIRR every
 * spreadsheet has. Bisection rather than Newton: Newton diverges on the ragged
 * flow patterns real portfolios produce, and the bracket here is known.
 * Flows are {t: ms, v: amount}, money out negative. Returns an annual rate,
 * or null when the flows never cross zero (all one direction, say).
 */
function xirr(flows) {
  if (!flows || flows.length < 2) return null;
  var t0 = flows[0].t, i;
  for (i = 1; i < flows.length; i++) if (flows[i].t < t0) t0 = flows[i].t;
  function npv(r) {
    var s = 0;
    for (var k = 0; k < flows.length; k++) {
      s += flows[k].v / Math.pow(1 + r, (flows[k].t - t0) / 31536000000);
    }
    return s;
  }
  var lo = -0.9999, hi = 1000, flo = npv(lo), fhi = npv(hi);
  if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return null;
  for (i = 0; i < 400; i++) {
    var m = (lo + hi) / 2, fm = npv(m);
    if (!isFinite(fm)) return null;
    if (flo * fm <= 0) { hi = m; fhi = fm; } else { lo = m; flo = fm; }
  }
  return (lo + hi) / 2;
}

/** Reads a fixed block of rows, skipping blanks. ids like 'q1','p1' ... */
function readRows(n, keys) {
  var out = [];
  for (var i = 1; i <= n; i++) {
    var row = {}, any = false;
    for (var k in keys) {
      var el = $(keys[k] + i);
      var raw = el ? el.value : '';
      if (String(raw).trim() !== '') any = true;
      row[k] = keys[k].charAt(0) === 'd' ? dparse(raw) : parseFloat(raw);
    }
    if (any) out.push(row);
  }
  return out;
}

/** Rupees to the paise, Indian grouping. Charges get compared against a
    contract note, where 6.50 and 6 are visibly different numbers. */
function inr2(v) {
  var n = Math.abs(Math.round((v || 0) * 100) / 100);
  if (!isFinite(n)) n = 0;
  // toFixed switches to exponential notation at 1e21, and paise stopped
  // meaning anything long before that — fall back to whole rupees.
  if (n >= 1e15) return (v < 0 ? '−₹' : '₹') + Math.round(n).toLocaleString('en-IN');
  var s = n.toFixed(2).split('.');
  var w = s[0], last3 = w.slice(-3), rest = w.slice(0, -3);
  if (rest) last3 = ',' + last3;
  return (v < -0.004 ? '−₹' : '₹') +
    rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + last3 + '.' + s[1];
}

</script>
<script>
(function () {
  'use strict';

  /* See the note in ipo-tracker: served from the repo the refresh job
   commits to, so the rates update with no deploy on your side. Falls
   back to the rates baked in below if it cannot be reached. */
  var CONFIG = { dataUrl: 'https://cdn.jsdelivr.net/gh/Shashank-95/financekeeda-tools@main/public/tools/rates.json' };

  /* ECB reference rates, euro-based, from build/fetch_ecb.py. Baked so the
     tool works before the fetch lands and survives it failing. */
  var DATA = {"updated":"2026-08-04","rates":{"USD":1.1515,"JPY":181.26,"GBP":0.85639,"CHF":0.9319,"AUD":1.6377,"CAD":1.6191,"CNY":7.7767,"HKD":9.0316,"INR":109.8285,"MYR":4.7125,"NZD":1.9568,"SGD":1.4767,"THB":38.385,"ZAR":18.9316,"EUR":1.0,"AED":4.228884,"SAR":4.318125,"QAR":4.19146}};

  var NAMES = {
    INR: 'Indian rupee', USD: 'US dollar', EUR: 'Euro', GBP: 'British pound',
    AED: 'UAE dirham', SGD: 'Singapore dollar', AUD: 'Australian dollar',
    CAD: 'Canadian dollar', JPY: 'Japanese yen', CHF: 'Swiss franc',
    NZD: 'New Zealand dollar', SAR: 'Saudi riyal', QAR: 'Qatari riyal',
    THB: 'Thai baht', MYR: 'Malaysian ringgit', CNY: 'Chinese yuan',
    HKD: 'Hong Kong dollar', ZAR: 'South African rand'
  };
  var SYM = { INR: '₹', USD: '$', EUR: '€', GBP: '£', JPY: '¥', CNY: '¥' };
  var ORDER = ['INR', 'USD', 'EUR', 'GBP', 'AED', 'SGD', 'AUD', 'CAD', 'JPY',
               'CHF', 'NZD', 'SAR', 'QAR', 'THB', 'MYR', 'CNY', 'HKD', 'ZAR'];

  /* GST on money changing — Rule 32(2)(b), CGST Rules. The tax is on this
     value, not on the amount exchanged. Slabs meet exactly at 1L and 10L. */
  function gstValue(inrGross) {
    if (!(inrGross > 0)) return 0;
    var v;
    if (inrGross <= 100000) v = Math.max(0.01 * inrGross, 250);
    else if (inrGross <= 1000000) v = 1000 + 0.005 * (inrGross - 100000);
    else v = 5500 + 0.001 * (inrGross - 1000000);
    return Math.min(v, 60000);
  }
  var GST = 0.18;

  function rate(cur) {
    var r = (DATA.rates || {})[cur];
    return (typeof r === 'number' && isFinite(r) && r > 0) ? r : null;
  }
  /** Units of `to` for one unit of `from`, crossed through the euro. */
  function cross(from, to) {
    var a = rate(from), b = rate(to);
    return (a && b) ? b / a : null;
  }
  function sym(c) { return SYM[c] || ''; }

  function money(v, cur) {
    if (!isFinite(v)) return '—';
    var s = Math.abs(v).toLocaleString(cur === 'INR' ? 'en-IN' : 'en-US',
      { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (v < 0 ? '−' : '') + sym(cur) + (sym(cur) ? '' : '') + s + (sym(cur) ? '' : ' ' + cur);
  }
  /** A rate needs more decimals when one unit is worth very little. */
  function rateStr(from, to, r) {
    if (r == null || !isFinite(r)) return '—';
    var dp = r >= 100 ? 2 : r >= 1 ? 4 : 6;
    return '1 ' + from + ' = ' + sym(to) + r.toFixed(dp).replace(/0+$/, '').replace(/\.$/, '') +
      (sym(to) ? '' : ' ' + to);
  }

  function fillSelect(id, val) {
    var el = $(id), html = '';
    for (var i = 0; i < ORDER.length; i++) {
      var c = ORDER[i];
      if (!rate(c)) continue;
      html += '<option value="' + c + '"' + (c === val ? ' selected' : '') + '>' +
        c + ' · ' + (NAMES[c] || c) + '</option>';
    }
    el.innerHTML = html;
    if (rate(val)) el.value = val;
  }

  function calc() {
    var from = $('from').value, to = $('to').value;
    var amt = clamp(num('amt'), 0, 1e12);
    var mk = clamp(num('mk'), 0, 25);

    $('u-amt').textContent = sym(from) || from;
    $('r-mk').textContent = mk.toFixed(2).replace(/\.?0+$/, '') + '%';

    var r = cross(from, to);
    if (r == null || !(amt > 0)) {
      ['o-get', 'o-mkt', 'o-rate', 'o-mkc', 'o-gst', 'o-cost'].forEach(function (i) {
        $(i).textContent = '—';
      });
      $('o-get-s').textContent = '';
      $('foot').innerHTML = 'Enter an amount to convert. Rates are the European Central ' +
        'Bank’s daily reference rates, crossed through the euro.';
      return;
    }

    /* The margin is applied to the rate, which is how it is actually
       charged: you are quoted a worse number, not billed a fee. Whichever
       way round the pair is, the customer ends up on the losing side. */
    var yourRate = r * (1 - mk / 100);
    var atMarket = amt * r;
    var got = amt * yourRate;

    /* GST is charged in India on the rupee value of the exchange, whichever
       direction it runs. */
    var inrGross = from === 'INR' ? amt : (to === 'INR' ? got : amt * (cross(from, 'INR') || 0));
    var gst = gstValue(inrGross) * GST;

    /* GST is a separate charge, so it comes out of the rupee side. Showing
       it inside the converted figure would be wrong for an INR->USD
       exchange, where the reader pays it on top of the rupees they hand
       over rather than out of the dollars they receive. */
    var marginCost = atMarket - got;                       // in `to` units
    var marginInr = from === 'INR' ? amt * (mk / 100)
                                   : marginCost * (cross(to, 'INR') || 0);

    $('o-get').textContent = money(got, to);
    $('o-get-s').textContent = 'at the market rate, ' + money(atMarket, to);
    $('lab-mkt').textContent = 'Market rate';
    $('o-mkt').textContent = rateStr(from, to, r);
    $('o-rate').textContent = rateStr(from, to, yourRate);
    $('o-mkc').textContent = inr(marginInr);
    $('o-gst').textContent = inr(gst);
    $('o-cost').textContent = inr(marginInr + gst);

    var pct = inrGross > 0 ? (marginInr + gst) / inrGross * 100 : 0;
    var slab = inrGross <= 100000
      ? (0.01 * inrGross < 250 ? 'the ₹250 minimum' : '1% of the amount')
      : inrGross <= 1000000 ? '₹1,000 + 0.5% of the amount over ₹1 lakh'
      : '₹5,500 + 0.1% of the amount over ₹10 lakh';
    $('foot').innerHTML = 'You lose <b>' + pct.toFixed(2) + '%</b> to the margin and GST. ' +
      'The margin is inside the rate you are quoted, not a line on your statement. ' +
      'GST here is ' + slab + '.';
  }

  fillSelect('from', 'INR');
  fillSelect('to', 'USD');

  document.querySelectorAll('[data-mk]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('[data-mk]').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      $('mk').value = b.dataset.mk;
      calc();
    });
  });
  $('swap').addEventListener('click', function () {
    var f = $('from').value;
    $('from').value = $('to').value;
    $('to').value = f;
    calc();
  });
  bind('amt', null, calc);
  bind('mk', null, calc);
  $('from').addEventListener('change', calc);
  $('to').addEventListener('change', calc);
  calc();

  if (CONFIG.dataUrl) {
    var stamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    fetch(CONFIG.dataUrl + '?d=' + stamp, { credentials: 'omit' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) {
        if (!d || !d.rates || !d.rates.USD) return;
        var f = $('from').value, t = $('to').value;
        DATA = d;
        fillSelect('from', f); fillSelect('to', t);
        calc();
      })
      .catch(function () { /* baked rates stand */ });
  }
})();
</script>
</body>
</html>
